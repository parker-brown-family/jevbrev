[package]
name = "jevbrev"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Short API definitions that code turns into Jev (TypeSafe System One) questions, answer readers and HTTP calls"
license = "MIT OR Apache-2.0"
repository = "https://github.com/parker-brown-family/jevbrev"
readme = "README.md"
keywords = ["api", "openapi", "jev", "typesafe", "llm"]
categories = ["command-line-utilities", "parser-implementations", "wasm"]
exclude = ["/.github", "/npm", "/pkg", "/tests/golden/*.actual.json"]

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "jevbrev"
path = "src/main.rs"
required-features = []

[features]
default = []
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen"]

[dependencies]
regex = { version = "1.13", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
wasm-bindgen = { version = "=0.2.130", optional = true }
serde-wasm-bindgen = { version = "0.6.5", optional = true }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = "debuginfo"
